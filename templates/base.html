<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DeadlineKu{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* ============ DESIGN TOKENS ============ */
        :root {
            /* Primary palette */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --violet: #8b5cf6;
            --indigo: #4f46e5;

            /* Semantic */
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --warning: #f59e0b;
            --success: #10b981;
            --info: #3b82f6;

            /* Gradients */
            --grad-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --grad-hero: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #5b21b6 100%);
            --grad-danger: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            --grad-warning: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --grad-success: linear-gradient(135deg, #10b981 0%, #047857 100%);
            --grad-info: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);

            /* Neutrals */
            --bg: #f7f8fc;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-light: #f1f5f9;
            --text: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;

            /* Shadows */
            --shadow-sm: 0 1px 3px rgba(15,23,42,0.04);
            --shadow: 0 4px 16px rgba(15,23,42,0.06);
            --shadow-md: 0 10px 32px rgba(15,23,42,0.08);
            --shadow-lg: 0 24px 48px rgba(15,23,42,0.12);
            --shadow-glow: 0 8px 32px rgba(99,102,241,0.35);
            --shadow-danger: 0 8px 32px rgba(239,68,68,0.3);

            /* Radius */
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
            --radius-full: 9999px;

            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============ RESET ============ */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Decorative background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 340px;
            background: var(--grad-hero);
            z-index: -1;
        }

        /* Decorative pattern */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 340px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(139,92,246,0.3), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(99,102,241,0.25), transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* ============ NAVBAR ============ */
        nav {
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            background: rgba(15, 23, 42, 0.35);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo {
            color: white;
            font-size: 19px;
            font-weight: 800;
            margin-right: 28px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.15);
            border-radius: var(--radius);
            display: grid; place-items: center;
            font-size: 18px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        nav a {
            color: rgba(255,255,255,0.72);
            text-decoration: none;
            padding: 9px 16px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        nav a:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        nav a.active {
            background: rgba(255,255,255,0.22);
            color: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        /* ============ CONTAINER ============ */
        .container {
            max-width: 1200px;
            margin: -90px auto 60px;
            padding: 0 24px;
            position: relative;
        }

        /* ============ PAGE TITLE ============ */
        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            color: white;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.7px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header p {
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ============ HERO / TERDEKAT CARD ============ */
        .hero {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: var(--radius-2xl);
            padding: 32px 36px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -8%;
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(139,92,246,0.15), transparent 70%);
            border-radius: 50%;
        }

        .hero-content { position: relative; z-index: 1; }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(99,102,241,0.1);
            color: var(--primary);
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -1px;
            margin-bottom: 8px;
            line-height: 1.15;
        }

        .hero-meta {
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .hero-countdown {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .countdown-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--danger);
            letter-spacing: -0.5px;
        }

        .countdown-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        /* ============ GRID ============ */
        .grid {
            display: grid;
            gap: 20px;
            margin-bottom: 24px;
        }

        .grid-5 { grid-template-columns: repeat(5, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-main { grid-template-columns: 1.4fr 1fr; }

        /* ============ STAT CARD ============ */
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(226,232,240,0.7);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .stat-card .accent {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
        }

        .stat-card .accent.merah { background: var(--grad-danger); }
        .stat-card .accent.kuning { background: var(--grad-warning); }
        .stat-card .accent.hijau { background: var(--grad-success); }
        .stat-card .accent.biru { background: var(--grad-info); }
        .stat-card .accent.ungu { background: var(--grad-primary); }

        .stat-icon {
            width: 42px; height: 42px;
            border-radius: var(--radius-sm);
            display: grid; place-items: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .stat-icon.merah { background: rgba(239,68,68,0.1); }
        .stat-icon.kuning { background: rgba(245,158,11,0.1); }
        .stat-icon.hijau { background: rgba(16,185,129,0.1); }
        .stat-icon.biru { background: rgba(59,130,246,0.1); }
        .stat-icon.ungu { background: rgba(139,92,246,0.1); }

        .stat-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--text);
            line-height: 1.2;
        }

        .stat-value.merah { color: var(--danger); }
        .stat-value.kuning { color: var(--warning); }
        .stat-value.hijau { color: var(--success); }
        .stat-value.biru { color: var(--info); }
        .stat-value.ungu { color: var(--violet); }

        /* ============ CARD ============ */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(226,232,240,0.7);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title-icon {
            width: 34px; height: 34px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            display: grid; place-items: center;
            font-size: 16px;
        }

        /* ============ PROGRESS CARD ============ */
        .progress-card {
            background: linear-gradient(135deg, #312e81 0%, #4338ca 100%);
            border-radius: var(--radius-lg);
            padding: 26px;
            color: white;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .progress-card::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
            border-radius: 50%;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .progress-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
        }

        .progress-value {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }

        .progress-track {
            background: rgba(255,255,255,0.15);
            height: 12px;
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a78bfa, #f0abfc, #fbbf24);
            border-radius: var(--radius-full);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-stats {
            display: flex;
            gap: 24px;
            margin-top: 16px;
            position: relative;
            z-index: 1;
        }

        .progress-stat-item {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
        }

        .progress-stat-item b {
            color: white;
            font-weight: 700;
        }

        /* ============ WARNING CARD ============ */
        .warning-card {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            color: white;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow-danger);
            animation: pulseWarning 3s ease-in-out infinite;
        }

        @keyframes pulseWarning {
            0%, 100% { box-shadow: 0 8px 32px rgba(239,68,68,0.3); }
            50% { box-shadow: 0 8px 40px rgba(239,68,68,0.5); }
        }

        .warning-icon {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.15);
            border-radius: var(--radius);
            display: grid; place-items: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .warning-text {
            flex: 1;
        }

        .warning-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .warning-sub {
            font-size: 13px;
            opacity: 0.85;
        }

        /* ============ URGENT LIST ============ */
        .urgent-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition);
        }

        .urgent-item:last-child {
            border-bottom: none;
        }

        .urgent-item:hover {
            padding-left: 6px;
        }

        .urgent-bar {
            width: 4px;
            height: 48px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
        }

        .urgent-icon {
            width: 44px; height: 44px;
            border-radius: var(--radius);
            display: grid; place-items: center;
            font-size: 20px;
            background: #f1f5f9;
            flex-shrink: 0;
        }

        .urgent-info { flex: 1; min-width: 0; }

        .urgent-title {
            font-weight: 600;
            color: var(--text);
            font-size: 15px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .urgent-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .urgent-right {
            text-align: right;
            flex-shrink: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .badge.merah { background: rgba(239,68,68,0.12); color: #dc2626; }
        .badge.kuning { background: rgba(245,158,11,0.12); color: #d97706; }
        .badge.biru { background: rgba(59,130,246,0.12); color: #2563eb; }
        .badge.hijau { background: rgba(16,185,129,0.12); color: #059669; }
        .badge.abu { background: rgba(100,116,139,0.12); color: var(--text-muted); }
        .badge.pulse {
            animation: pulseBadge 1.5s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .urgent-countdown {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ============ REKAP MATKUL ============ */
        .matkul-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .matkul-item:last-child {
            border-bottom: none;
        }

        .matkul-avatar {
            width: 44px; height: 44px;
            border-radius: var(--radius);
            background: var(--grad-primary);
            display: grid; place-items: center;
            color: white;
            font-weight: 800;
            font-size: 15px;
            flex-shrink: 0;
            letter-spacing: -0.5px;
        }

        .matkul-info { flex: 1; min-width: 0; }

        .matkul-name {
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .matkul-bar {
            height: 5px;
            background: var(--border-light);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .matkul-bar-fill {
            height: 100%;
            background: var(--grad-primary);
            border-radius: var(--radius-full);
            transition: width 0.8s;
        }

        .matkul-stats {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .matkul-bobot {
            font-weight: 800;
            color: var(--violet);
            font-size: 15px;
            flex-shrink: 0;
        }

        /* ============ FORM ============ */
        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 14px;
            color: var(--text);
            background: var(--surface);
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
        }

        .form-input::placeholder { color: var(--text-light); }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px 20px;
            background: var(--grad-primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-glow);
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(99,102,241,0.5);
        }

        /* ============ FILTER BAR ============ */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .filter-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-pills a {
            padding: 7px 16px;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .filter-pills a:hover {
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .filter-pills a.active {
            background: var(--grad-primary);
            color: white;
            border-color: transparent;
            box-shadow: var(--shadow-glow);
        }

        .filter-selects {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-selects select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-weight: 500;
        }

        /* ============ TUGAS CARD ============ */
        .tugas-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(226,232,240,0.7);
            margin-bottom: 12px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .tugas-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
        }

        .tugas-card.p-merah::before { background: var(--grad-danger); }
        .tugas-card.p-kuning::before { background: var(--grad-warning); }
        .tugas-card.p-biru::before { background: var(--grad-info); }
        .tugas-card.p-hijau::before { background: var(--grad-success); }

        .tugas-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .tugas-card.selesai {
            opacity: 0.55;
        }

        .tugas-card.selesai .tugas-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .tugas-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-left: 8px;
        }

        .tugas-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .tugas-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
        }

        .tugas-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tugas-catatan {
            font-size: 13px;
            font-style: italic;
            color: var(--text-light);
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--border);
        }

        .tugas-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tugas-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 36px; height: 36px;
            border-radius: var(--radius-sm);
            display: grid; place-items: center;
            text-decoration: none;
            font-size: 15px;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            color: white;
        }

        .btn-icon.toggle { background: var(--success); }
        .btn-icon.toggle:hover { background: #059669; transform: scale(1.08); }

        .btn-icon.edit { background: var(--warning); }
        .btn-icon.edit:hover { background: #d97706; transform: scale(1.08); }

        .btn-icon.delete { background: var(--danger); }
        .btn-icon.delete:hover { background: var(--danger-dark); transform: scale(1.08); }

        /* ============ TABLE ============ */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        th {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            background: #f8fafc;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafbfc; }

        /* ============ EMPTY ============ */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: var(--text);
            font-weight: 700;
        }

        .empty p { font-size: 14px; }

        /* ============ LINK ============ */
        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }

        .link:hover {
            gap: 8px;
            color: var(--primary-dark);
        }

        .link-white {
            color: white;
            background: rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: var(--radius-full);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .link-white:hover {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        /* ============ ANIMATIONS ============ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeInUp 0.55s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }

        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }
        .delay-4 { animation-delay: 0.2s; }
        .delay-5 { animation-delay: 0.25s; }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 900px) {
            .grid-5, .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-main { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr; }
        }

        @media (max-width: 640px) {
            .grid-5, .grid-4, .grid-3, .grid-2, .grid-main { grid-template-columns: 1fr; }
            .hero { padding: 24px 20px; }
            .hero-title { font-size: 24px; }
            .countdown-value { font-size: 22px; }
            .form-row, .form-row-3 { grid-template-columns: 1fr; }
            .nav-inner { flex-wrap: wrap; gap: 4px; }
            .container { margin-top: -70px; padding: 0 16px; }
            .card { padding: 18px; }
            .page-header h1 { font-size: 22px; }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
    <div class="nav-inner">
        <div class="logo">
            <span class="logo-icon">📚</span>
            DeadlineKu
        </div>
        <a href="/" class="{{ 'active' if request.path == '/' }}">🏠 Dashboard</a>
        <a href="/tugas" class="{{ 'active' if request.path.startswith('/tugas') }}">📝 Tugas</a>
        <a href="/kegiatan" class="{{ 'active' if request.path.startswith('/kegiatan') }}">📅 Kegiatan</a>
        <a href="/pengingat" class="{{ 'active' if request.path.startswith('/pengingat') }}">
            🔔 Pengingat
            {% if pengingat is defined and pengingat %}
            <span style="background:#ef4444; color:white; border-radius:999px;
                         padding:1px 8px; font-size:11px; margin-left:4px;
                         font-weight:700;">{{ pengingat|length }}</span>
            {% endif %}
        </a>
        <a href="/riwayat" class="{{ 'active' if request.path.startswith('/riwayat') }}">📋 Riwayat</a>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

{% block extra_script %}{% endblock %}
</body>
</html>
