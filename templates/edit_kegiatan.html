{% extends "base.html" %}
{% block title %}Edit Kegiatan{% endblock %}
{% block content %}

<div class="page-header animate-in">
    <h1>✎ Edit Kegiatan</h1>
    <p>Ubah detail jadwal kegiatanmu</p>
</div>

<div style="max-width: 640px; margin: 0 auto;">
    <div class="card animate-in delay-1">

        {% if request.args.get('error') == 'bentrok' %}
        <div style="margin-bottom: 16px; padding: 12px 16px; background: #fee2e2;
                    border-left: 4px solid #ef4444; border-radius: 8px; color: #991b1b;
                    font-size: 14px; font-weight: 600;">
            ⚠️ Jadwal bentrok dengan kegiatan lain di hari yang sama!
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nama Kegiatan</label>
                    <input type="text" name="nama" class="form-input"
                           value="{{ kegiatan.nama }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Jenis</label>
                    <select name="jenis" class="form-select" required>
                        {% for j in jenis_kegiatan %}
                        <option value="{{ j }}" {{ 'selected' if kegiatan.jenis == j }}>{{ j }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label class="form-label">Hari</label>
                    <select name="hari" class="form-select" required>
                        {% for h in hari_list %}
                        <option value="{{ h }}" {{ 'selected' if kegiatan.hari == h }}>{{ h }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Jam Mulai</label>
                    <input type="time" name="jam_mulai" class="form-input"
                           value="{{ kegiatan.jam_mulai }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Jam Selesai</label>
                    <input type="time" name="jam_selesai" class="form-input"
                           value="{{ kegiatan.jam_selesai }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Lokasi</label>
                    <input type="text" name="lokasi" class="form-input"
                           value="{{ kegiatan.lokasi }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Catatan</label>
                    <input type="text" name="catatan" class="form-input"
                           value="{{ kegiatan.catatan }}">
                </div>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;
                              padding: 12px; background: #f8fafc; border-radius: 8px;
                              font-weight: 600; font-size: 14px;">
                    <input type="checkbox" name="reminder" value="1"
                           style="width: 18px; height: 18px; cursor: pointer;"
                           {{ 'checked' if kegiatan.reminder }}>
                    🔔 Aktifkan pengingat hari-H
                </label>
            </div>

            <button type="submit" class="btn-primary">💾 Simpan Perubahan</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/kegiatan" class="link">← Kembali ke Jadwal</a>
        </div>
    </div>
</div>

{% endblock %}
